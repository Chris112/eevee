<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2414">
<title>Eevee</title>
<style>
  :root {
    --bg: #3a2414;
    --bg-glow: #7a4a24;
    --fur: #c98a4b;
    --ruff: #f3e2c2;
    --ink: #fff6e8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at 50% 42%, var(--bg-glow), var(--bg) 70%);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  main {
    display: grid;
    justify-items: center;
    gap: 28px;
    padding: 24px 16px;
    width: 100%;
  }
  button {
    width: min(64vw, 260px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: 10px solid var(--ruff);
    background: var(--fur);
    box-shadow: 0 0 0 0 rgba(243, 226, 194, 0.5), 0 18px 40px rgba(0, 0, 0, 0.35);
    color: var(--ink);
    font: inherit;
    font-size: clamp(22px, 7vw, 30px);
    font-weight: 700;
    cursor: pointer;
    transition: transform 120ms ease;
    animation: breathe 2.4s ease-in-out infinite;
  }
  button:active { transform: scale(0.95); }
  button.playing { animation: none; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(243, 226, 194, 0.45), 0 18px 40px rgba(0, 0, 0, 0.35); }
    50% { box-shadow: 0 0 0 18px rgba(243, 226, 194, 0), 0 18px 40px rgba(0, 0, 0, 0.35); }
  }
  canvas { width: min(88vw, 420px); height: 120px; }
  p { margin: 0; font-size: 18px; opacity: 0.8; min-height: 1.4em; }
</style>
</head>
<body>
<main>
  <button id="play" type="button">Tap me!</button>
  <canvas id="wave"></canvas>
  <p id="hint">Eevee wants to say hi</p>
</main>
<script>
  const CLIPS = ["eevee", "happy", "call", "questioning", "battle", "sad", "mad"];
  const button = document.getElementById("play");
  const hint = document.getElementById("hint");
  const canvas = document.getElementById("wave");
  const ctx2d = canvas.getContext("2d");
  const audio = new Audio();
  audio.preload = "auto";

  // iOS 17+: play through the silent switch like a media app.
  if (navigator.audioSession) navigator.audioSession.type = "playback";

  let lastClip = null;
  let analyser = null;
  let levels = null;

  function pickClip() {
    const choices = CLIPS.filter((c) => c !== lastClip);
    lastClip = choices[Math.floor(Math.random() * choices.length)];
    return `sounds/${lastClip}.mp3`;
  }

  // The analyser needs an AudioContext, which browsers only allow after a tap.
  function connectAnalyser() {
    if (analyser) return;
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ac.createAnalyser();
    analyser.fftSize = 64;
    levels = new Uint8Array(analyser.frequencyBinCount);
    ac.createMediaElementSource(audio).connect(analyser);
    analyser.connect(ac.destination);
    ac.resume();
  }

  async function play(fromTap) {
    if (fromTap) connectAnalyser();
    audio.src = pickClip();
    try {
      await audio.play();
      button.classList.add("playing");
      button.textContent = "Vee!";
      hint.textContent = "Tap again for another";
    } catch {
      // Autoplay blocked on page open: wait for a tap.
      hint.textContent = "Eevee wants to say hi";
    }
  }

  audio.addEventListener("ended", () => {
    button.classList.remove("playing");
    button.textContent = "Again!";
  });
  button.addEventListener("click", () => play(true));

  const BARS = 24;
  function draw(t) {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (canvas.width !== w * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx2d.clearRect(0, 0, w, h);
    const live = analyser && !audio.paused;
    if (live) analyser.getByteFrequencyData(levels);
    const gap = w / BARS;
    ctx2d.fillStyle = "#f3e2c2";
    for (let i = 0; i < BARS; i++) {
      const idle = 0.08 + 0.05 * Math.sin(t / 500 + i * 0.6);
      const level = live ? Math.max(idle, levels[Math.min(i, levels.length - 1)] / 255) : idle;
      const barH = Math.max(6, level * h);
      const x = i * gap + gap * 0.2;
      ctx2d.beginPath();
      ctx2d.roundRect(x, (h - barH) / 2, gap * 0.6, barH, 4);
      ctx2d.fill();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  play(false);
</script>
</body>
</html>
